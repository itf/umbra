<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level Editor — Papa Sangre</title>
    <link rel="stylesheet" href="/src/editor/editor.css" />
  </head>
  <body>
    <header id="topbar">
      <strong>Level Editor</strong>
      <input id="level-name" type="text" aria-label="Level name" placeholder="Level name" />
      <button id="btn-new">New</button>
      <button id="btn-save">Save</button>
      <select id="level-list" aria-label="Saved levels"><option value="">— load saved —</option></select>
      <button id="btn-delete">Delete</button>
      <span class="sep"></span>
      <button id="btn-export">Export JSON</button>
      <button id="btn-import">Import JSON</button>
      <input id="file-input" type="file" accept="application/json" hidden />
      <a id="btn-play" href="/?level=current" target="_blank">▶ Play</a>
    </header>

    <div id="layout">
      <aside id="palette" aria-label="Tools">
        <h2>Tool</h2>
        <div class="tools">
          <button class="tool" data-tool="select" aria-pressed="true">Select / Move</button>
          <button class="tool" data-tool="start">Start point</button>
          <button class="tool" data-tool="beacon">Beacon</button>
          <button class="tool" data-tool="wall">Wall</button>
          <button class="tool" data-tool="floor">Floor zone</button>
          <button class="tool" data-tool="ceiling">Ceiling zone</button>
          <button class="tool" data-tool="monster">Monster</button>
          <button class="tool" data-tool="absorber">Material patch</button>
          <button class="tool" data-tool="ambience">Ambient source</button>
          <button class="tool" data-tool="win">Win area</button>
          <button class="tool" data-tool="exit">Exit (escape)</button>
        </div>

        <h2>Material</h2>
        <select id="material" aria-label="Material for new walls/floors"></select>

        <h2>Room</h2>
        <label><span>Open space (no walls)</span><input id="room-open" type="checkbox" /></label>
        <label>Width <input id="room-w" type="number" min="2" max="200" step="1" /></label>
        <label>Depth <input id="room-d" type="number" min="2" max="200" step="1" /></label>
        <label>Height <input id="room-h" type="number" min="2" max="20" step="0.5" /></label>
        <label>Wall material <select id="room-mat" aria-label="Default perimeter wall material"></select></label>
        <label>Floor material <select id="floor-mat" aria-label="Default floor material"></select></label>
        <label><span>Ceiling</span><input id="room-ceil" type="checkbox" /></label>
        <label>Ceiling height <input id="ceil-h" type="number" min="2" max="20" step="0.5" /></label>
        <label>Ceiling material <select id="ceil-mat" aria-label="Default ceiling material"></select></label>
        <label>Speed of sound (m/s) <input id="room-sos" type="number" min="100" max="700" step="1" placeholder="343" aria-label="Speed of sound in metres per second (blank = default 343)" /></label>
        <label>Clutter (0–1) <input id="room-clutter" type="number" min="0" max="1" step="0.05" placeholder="0" aria-label="Clutter 0 to 1: raises absorption + scattering to tame a fluttery room (blank = 0)" /></label>

        <h2>Objective</h2>
        <label>Goal mode
          <select id="goal-mode" aria-label="Win objective: navigate to a beacon, or find the absorber dead-spot">
            <option value="beacon">beacon</option>
            <option value="absorber">absorber</option>
            <option value="escape">escape</option>
          </select>
        </label>
        <label>Decoy budget <input id="decoy-budget" type="number" min="0" step="1" placeholder="∞" aria-label="Max decoys the player may throw this level (blank = unlimited); used in escape mode" /></label>
        <label>Clap budget <input id="clap-budget" type="number" min="0" step="1" placeholder="∞" aria-label="Max claps for the level (blank or 0 = unlimited)" /></label>
        <label>Clap cooldown (ms) <input id="clap-cooldown" type="number" min="0" step="50" placeholder="0" aria-label="Minimum milliseconds between claps (blank or 0 = none)" /></label>

        <h2>Reaction events</h2>
        <label>Required reactions <input id="required-reactions" type="number" min="0" step="1" placeholder="0" aria-label="Minimum reaction hits needed to win, in addition to reaching the win area (blank or 0 = ungated)" /></label>
        <div id="events-editor" aria-label="Reaction events"></div>
        <button id="btn-add-event" type="button">+ Add reaction event</button>

        <h2 id="props-title">Selection</h2>
        <div id="props"><p class="hint">Nothing selected.</p></div>

        <details id="objects-section" open>
          <summary>Objects</summary>
          <div id="object-list" aria-label="Scene objects"></div>
        </details>
      </aside>

      <main id="canvas-wrap">
        <canvas id="canvas" tabindex="0" aria-label="Level map. Click to place, drag to move."></canvas>
        <div id="statusbar"><span id="coords">—</span> · <span id="hint" role="status" aria-live="polite">Pick a tool, then click the map.</span></div>
      </main>
    </div>

    <script type="module" src="/src/editor/editor.ts"></script>
  </body>
</html>
