<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echolocation Trainer — Papa Sangre</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b0b0b; color: #eee; font: 16px/1.5 system-ui, sans-serif; padding: 16px; max-width: 640px; margin: 0 auto; }
      h1 { font-size: 1.3rem; }
      .hint { color: #9aa; font-size: 14px; }
      .panel { background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px; margin: 14px 0; }
      button { background: #ffd166; color: #000; border: 0; border-radius: 12px; padding: 16px 18px; font-size: 1rem; font-weight: 700; cursor: pointer; min-height: 56px; min-width: 120px; }
      button:disabled { opacity: 0.5; cursor: default; }
      .big { display: block; width: 100%; font-size: 1.15rem; padding: 20px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; }
      .row > button { flex: 1 1 140px; }
      .play { background: #5bd1ff; }
      .answer { background: #2c2c2c; color: #eee; border: 2px solid #444; }
      .answer.correct { background: #1f7a3f; border-color: #6ee787; color: #fff; }
      .answer.wrong { background: #7a1f1f; border-color: #ff6b6b; color: #fff; }
      #prompt { font-size: 1.25rem; font-weight: 700; margin: 4px 0 12px; }
      #feedback { min-height: 1.5em; font-weight: 700; margin-top: 12px; }
      #score { font-variant-numeric: tabular-nums; color: #9aa; }
      label { display: inline-flex; flex-direction: column; gap: 4px; font-size: 13px; color: #9aa; }
      select { background: #1c1c1c; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 8px; font-size: 1rem; min-height: 44px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    </style>
  </head>
  <body>
    <h1>Echolocation Trainer</h1>
    <p class="hint">
      Train your ear to read rooms. Put on headphones, close your eyes, and answer
      which room is bigger, wider, longer, softer, rougher — or where a sound is.
      Everything is announced for screen readers.
    </p>

    <div class="panel" id="begin-panel">
      <label>Exercise type
        <select id="type" aria-label="Exercise type">
          <option value="all">Mixed (all)</option>
          <option value="larger">Larger / smaller room</option>
          <option value="wider">Wider room</option>
          <option value="longer">Longer room</option>
          <option value="carpet">Carpet vs hard</option>
          <option value="brick">Brick vs concrete</option>
          <option value="direction">Sound direction</option>
          <option value="reflector">Panel left vs right (echo direction)</option>
          <option value="distance">Distance to wall (echo delay)</option>
          <option value="gap">Find the gap (which side is open)</option>
        </select>
      </label>
      <label style="margin-top:14px">Difficulty
        <select id="difficulty-mode" aria-label="Difficulty mode">
          <option value="adaptive">Adaptive (tracks your threshold)</option>
          <option value="0">Fixed — easy</option>
          <option value="0.35">Fixed — moderate</option>
          <option value="0.6">Fixed — firm</option>
          <option value="0.85">Fixed — hard</option>
          <option value="1">Fixed — expert</option>
        </select>
      </label>
      <label style="margin-top:14px">Probe sound (the "echo" you fire)
        <select id="probe" aria-label="Probe sound">
        </select>
      </label>
      <p id="probe-hint" class="hint" style="margin:4px 0 0"></p>
      <label style="margin-top:10px">Custom recording (used when "Custom recording" is selected)
        <input id="probe-url" type="text" inputmode="url" placeholder="https://… audio URL"
               aria-label="Custom probe recording URL"
               style="background:#1c1c1c;color:#eee;border:1px solid #333;border-radius:8px;padding:8px;font-size:1rem;min-height:44px" />
      </label>
      <input id="probe-file" type="file" accept="audio/*" aria-label="Custom probe recording file"
             style="margin-top:8px;color:#9aa" />
      <button id="begin" class="big" style="margin-top:14px">▶ Begin (headphones on)</button>
    </div>

    <div id="drill" hidden>
      <div class="panel" aria-live="off">
        <p id="prompt"></p>

        <div id="play-ab" class="row" hidden>
          <button id="play-a" class="play">👏 Play Room A</button>
          <button id="play-b" class="play">👏 Play Room B</button>
        </div>
        <div id="play-single" class="row" hidden>
          <button id="play-s" class="play big">🔊 Play sound</button>
        </div>

        <div id="answers" class="row" style="margin-top:14px"></div>
        <p id="feedback" role="status"></p>
      </div>

      <div class="panel row" style="align-items:center; justify-content:space-between">
        <span id="score">Score 0 / 0</span>
        <button id="next" disabled>Next →</button>
      </div>
    </div>

    <p class="hint"><a href="/" style="color:#5bd1ff">← Game</a> · <a href="/debug.html" style="color:#5bd1ff">Debug scenes</a> · <a href="/editor.html" style="color:#5bd1ff">Editor</a></p>

    <div id="live" class="sr-only" role="status" aria-live="assertive" aria-atomic="true"></div>

    <script type="module" src="/src/trainer/trainer.ts"></script>
  </body>
</html>
